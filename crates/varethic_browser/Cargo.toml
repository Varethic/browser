[package]
name = "varethic-browser"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Varethic browser: Rust shell over WebView2 (Windows) with Chromium-migration roadmap"

[dependencies]
varethic-url = { path = "../varethic_url" }
varethic-engine-core = { path = "../varethic_engine_core" }
varethic-storage = { path = "../varethic_storage" }
varethic-net = { path = "../varethic_net" }
varethic-dom = { path = "../varethic_dom" }
tao = "0.37"
wry = "0.57"
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread"] }

[features]
default = []
